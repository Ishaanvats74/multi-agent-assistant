name: multi_agent_assistant CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  test:
    name: Test Application
    runs-on: ubuntu-latest
  
    env:
        PYTHONPATH: src
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        DIFFBOT_API_TOKEN: ${{ secrets.DIFFBOT_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --dev

      - name: Check Python version
        run: uv run python --version

      - name: Check imports
        
        run: |
          uv run python -c "import multi_agent_assistant"
          uv run python -c "import multi_agent_assistant.main"
          uv run python -c "import multi_agent_assistant.agents"
          uv run python -c "import multi_agent_assistant.graph"
          uv run python -c "import multi_agent_assistant.models"
          uv run python -c "import multi_agent_assistant.tools"
    
      - name: Run tests

        run: uv run pytest -v

      - name: Test coverage
        run: |
          uv run pytest \
            --cov=multi_agent_assistant \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t multi_agent_assistant:ci .

      - name: Verify Docker image
        run: docker image inspect multi_agent_assistant:ci
